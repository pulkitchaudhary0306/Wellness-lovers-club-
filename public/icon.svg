<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3826"/>
      <stop offset="60%" stop-color="#071d13"/>
      <stop offset="100%" stop-color="#04100a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8"/>
      <stop offset="35%" stop-color="#dfc18d"/>
      <stop offset="70%" stop-color="#bca374"/>
      <stop offset="100%" stop-color="#8c7347"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dfc18d" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.45"/>

  <!-- Top Crown / Lotus Petal Flourish -->
  <g transform="translate(256, 125) scale(0.95)" filter="url(#subtleGlow)">
    <!-- Center Diamond Star -->
    <path d="M0 -34 L9 -9 L34 0 L9 9 L0 34 L-9 9 L-34 0 L-9 -9 Z" fill="url(#goldGrad)"/>
    <!-- Left Leaf Arc -->
    <path d="M -22 -2 C -50 -18, -75 5, -85 24 C -68 18, -42 16, -20 6 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Right Leaf Arc -->
    <path d="M 22 -2 C 50 -18, 75 5, 85 24 C 68 18, 42 16, 20 6 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Prominent Bold Monogram "WLC" (Crystal-clear & legible at 16x16 / 32x32) -->
  <g id="monogram" fill="url(#goldGrad)" text-anchor="middle" font-family="'Montserrat', 'Cinzel', 'Playfair Display', Georgia, sans-serif">
    <text x="256" y="360" font-size="168" font-weight="900" letter-spacing="6" filter="url(#subtleGlow)">WLC</text>
  </g>

  <!-- Bottom Refined Sub-Badge -->
  <g transform="translate(256, 420)">
    <line x1="-120" y1="0" x2="-45" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="0" r="4.5" fill="url(#goldGrad)"/>
    <line x1="45" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
